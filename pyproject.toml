[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routepanel"
version = "0.1.0"
description = "Self-hosted AmneziaWG gateway with per-service exit routing"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
    "jinja2>=3.1",
    "dnspython>=2.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
routepanel = "routepanel.panel.app:main"
routesyncd = "routepanel.syncd.main:main"
routepanel-passwd = "routepanel.passwd_cli:main"
routepanel-awg-init = "routepanel.awg_init_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
