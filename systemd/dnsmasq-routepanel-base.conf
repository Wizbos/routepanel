# Install to /etc/dnsmasq.d/routepanel-base.conf
# dnsmasq is the ipset-tagging resolver: it listens on :5353, tags matched
# queries into the rule_<id> ipsets (fragment included below), and forwards
# everything upstream to dnscrypt-proxy for resolution.
user=root   # required: dnsmasq must be root to modify ipsets (CAP_NET_ADMIN)
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
server=127.0.0.1#5054          # forward everything to dnscrypt-proxy (DoH/DNSCrypt)
conf-file=/etc/routepanel/dnsmasq-routepanel.conf   # generated ipset= fragment
