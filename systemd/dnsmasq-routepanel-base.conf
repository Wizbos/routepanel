# Install to /etc/dnsmasq.d/routepanel-base.conf (Task 14b).
# dnsmasq runs as AGH's upstream on :5353 and tags ipsets; the rule_<id> lines
# live in the generated fragment included below.
user=root   # required: dnsmasq must be root to modify ipsets (CAP_NET_ADMIN)
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
server=127.0.0.1#5054          # forward everything to cloudflared (DoH)
conf-file=/etc/routepanel/dnsmasq-routepanel.conf   # generated ipset= fragment
